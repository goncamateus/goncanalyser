[project]
name = "video-tuner"
version = "0.2.0"
description = "Qt video player with live OpenCV tuning: adjustments, contours, background subtraction"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyqt6>=6.7",
]

[project.scripts]
video-tuner = "main:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["gui*", "processing*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
