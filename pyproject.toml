[project]
name = "analyser"
version = "0.3.0"
description = "Qt workspace for live OpenCV feature analysis: adjustments, colour, texture, keypoints, structures"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0",
    # headless, not the plain wheel: nothing here calls cv2.imshow/waitKey, and the
    # plain wheel ships its own Qt libraries that fight PyQt6's inside a frozen bundle.
    "opencv-python-headless>=4.10",
    "pyqt6>=6.7",
    "scikit-image>=0.24",
]

[project.scripts]
analyser = "main:main"

[dependency-groups]
dev = ["pytest"]
build = ["pyinstaller>=6.11"]
# Ground-truth work: reading a COCO dataset and tuning against it. A group, not a
# runtime dependency, because neither is needed to open an image — the desktop
# bundle ships without them and `ui.main_window.analyse_dataset` says so rather
# than failing at launch. No pycocotools: COCO annotations are plain JSON,
# polygons decode with cv2.fillPoly, and crowd RLE is a handful of lines.
dataset = ["matplotlib>=3.8", "optuna>=4.0"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "features*", "ui*", "dataset*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
